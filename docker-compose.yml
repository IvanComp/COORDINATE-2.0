version: '3.8'

services:
  coordinate:
    image: ivancompd/coordinate-2.0:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    volumes:
      # Persist simulation results
      - ./results:/app/results
      # Persist configuration
      - ./configuration:/app/configuration
    environment:
      - FLASK_APP=backend.app
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5002/api/topologies')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  results:
  configuration:
