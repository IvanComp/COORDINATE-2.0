<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="740" viewBox="0 0 1500 740">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#111111"/>
    </marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #111111; }
      .layer-title { font-size: 28px; font-weight: 700; }
      .box-title { font-size: 23px; font-weight: 700; }
      .box-text { font-size: 21px; }
      .arrow-label { font-size: 19px; fill: #222222; }
      .small { font-size: 17px; fill: #444444; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2.2; }
      .runtime { fill: #f8f8f8; stroke: #111111; stroke-width: 2.5; }
      .monitor { fill: #e9f2ff; stroke: #111111; stroke-width: 2.2; stroke-dasharray: 9 7; }
      .learning { fill: #fff2cc; stroke: #111111; stroke-width: 2.2; stroke-dasharray: 9 7; }
      .arrow { fill: none; stroke: #111111; stroke-width: 2.4; marker-end: url(#arrow); }
      .dashed-arrow { fill: none; stroke: #111111; stroke-width: 2.4; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1500" height="740" fill="#ffffff"/>

  <!-- Layer containers -->
  <rect class="learning" x="560" y="70" width="840" height="210" rx="16"/>
  <text class="layer-title" x="980" y="116" text-anchor="middle">Learning Layer</text>

  <rect class="monitor" x="560" y="430" width="840" height="220" rx="16"/>
  <text class="layer-title" x="980" y="478" text-anchor="middle">Monitoring Layer</text>

  <!-- COORDINATE runtime -->
  <rect class="runtime" x="70" y="250" width="315" height="125" rx="18"/>
  <text class="box-title" x="228" y="294" text-anchor="middle">COORDINATE 2.0 Runtime</text>
  <text class="box-text" x="228" y="330" text-anchor="middle">executes selected</text>
  <text class="box-text" x="228" y="360" text-anchor="middle">coordination mechanism</text>

  <rect class="box" x="120" y="520" width="215" height="82" rx="10"/>
  <text class="box-text" x="228" y="554" text-anchor="middle">Simulation Event</text>
  <text class="box-text" x="228" y="584" text-anchor="middle">Stream during \(W_j\)</text>

  <!-- Learning layer -->
  <rect class="box" x="640" y="155" width="225" height="82" rx="12"/>
  <text class="box-title" x="752" y="188" text-anchor="middle">Contextual</text>
  <text class="box-title" x="752" y="219" text-anchor="middle">Bandit</text>

  <rect class="box" x="1040" y="155" width="295" height="82" rx="12"/>
  <text class="box-text" x="1188" y="188" text-anchor="middle">Policy / Value Estimates</text>
  <text class="box-text" x="1188" y="219" text-anchor="middle">for \(\{CE, SD, FD\}\)</text>

  <!-- Bridge boxes -->
  <rect class="box" x="820" y="330" width="260" height="66" rx="12"/>
  <text class="box-title" x="950" y="371" text-anchor="middle">Context Vector \(x_j\)</text>

  <rect class="box" x="1135" y="330" width="190" height="66" rx="12"/>
  <text class="box-title" x="1230" y="371" text-anchor="middle">Reward \(r_{j+1}\)</text>

  <!-- Monitoring layer -->
  <rect class="box" x="625" y="520" width="170" height="78" rx="12"/>
  <text class="box-title" x="710" y="552" text-anchor="middle">RTLola</text>
  <text class="box-text" x="710" y="582" text-anchor="middle">Monitor</text>

  <rect class="box" x="880" y="520" width="260" height="78" rx="12"/>
  <text class="box-text" x="1010" y="552" text-anchor="middle">MAS Performance</text>
  <text class="box-text" x="1010" y="582" text-anchor="middle">Objective \(s_j\)</text>

  <rect class="box" x="1230" y="520" width="130" height="78" rx="12"/>
  <text class="box-text" x="1295" y="552" text-anchor="middle">Runtime</text>
  <text class="box-text" x="1295" y="582" text-anchor="middle">Indicators</text>

  <!-- Arrows: runtime to monitor -->
  <path class="arrow" d="M 228 375 L 228 520"/>
  <text class="arrow-label" x="270" y="455">event stream during \(W_j\)</text>

  <path class="arrow" d="M 335 561 L 625 561"/>
  <text class="arrow-label" x="475" y="541" text-anchor="middle">events in \(W_j\)</text>

  <path class="arrow" d="M 795 559 L 880 559"/>
  <path class="arrow" d="M 1140 559 L 1230 559"/>

  <!-- Monitoring outputs -->
  <path class="arrow" d="M 1295 520 L 1295 415 L 950 415 L 950 396"/>

  <path class="dashed-arrow" d="M 1230 520 L 1230 396"/>
  <text class="arrow-label" x="1360" y="455" text-anchor="middle">observed performance</text>
  <text class="arrow-label" x="1360" y="480" text-anchor="middle">in \(W_{j+1}\)</text>

  <!-- Context and reward to bandit -->
  <path class="arrow" d="M 950 330 L 950 292 L 752 292 L 752 237"/>

  <path class="dashed-arrow" d="M 1230 330 L 1230 292 L 752 292 L 752 237"/>

  <!-- Learning decision -->
  <path class="arrow" d="M 865 196 L 1040 196"/>
  <text class="arrow-label" x="952" y="177" text-anchor="middle">decision \(c_j\)</text>

  <!-- Main return loop -->
  <path class="arrow" d="M 1335 196 L 1445 196 L 1445 35 L 228 35 L 228 250"/>
  <text class="arrow-label" x="820" y="28" text-anchor="middle">Selected mechanism \(c_j\) applied in \(W_{j+1}\)</text>

  <!-- MAS parameters -->
  <path class="arrow" d="M 385 313 L 475 313 L 475 520 L 625 520"/>
  <text class="arrow-label" x="464" y="294" text-anchor="middle">MAS Parameters</text>

  <!-- Reader notes -->
  <text class="small" x="228" y="662" text-anchor="middle">COORDINATE 2.0 produces the trace</text>
  <text class="small" x="980" y="692" text-anchor="middle">The decision uses \(x_j\); the reward \(r_{j+1}\) arrives after observing \(W_{j+1}\)</text>
</svg>
